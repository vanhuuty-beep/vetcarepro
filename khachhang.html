<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Khách hàng - VetCare Pro</title>
    <!-- Thư viện Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="js/config.js"></script>
	<script src="js/supabase.js"></script>
	<script src="js/utils.js"></script>
    <script src="js/menu.js"></script>
	<script src="js/smart-search.js"></script>
	<script src="js/vaccine-popup.js"></script>

    <!-- Gọi file CSS chung -->
    <link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/style1.css">
	<link rel="stylesheet" href="css/smart-search.css">

    <style>
        .search-box {
            padding: 8px 12px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .card-header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn-add-pet {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }
        .btn-add-pet:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

    <!-- THANH MENU -->
    <div id="menu-container"></div>

    <!-- NỘI DUNG CHÍNH -->
    <div class="main-content">
        <div id="topnav-container"></div>

        <div class="content-body">
            <div class="card">
                <div class="card-header">
                    <h3>Danh sách khách hàng</h3>
                    <div class="card-header-actions">
                        <input type="text" id="searchInput" class="search-box" placeholder="Tìm theo tên hoặc SĐT..." onkeyup="timKiemKhachHang()">
                        <button class="btn-primary" onclick="moModalThem()">+ Thêm khách hàng mới</button>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Mã KH</th>
                                <th>Khách hàng & SĐT</th>
                                <th>Địa chỉ</th>
                                <th>Thú cưng</th>
                                <th>Lần khám gần nhất</th>
                                <th>Tổng chi tiêu</th>
                                <th>Loại khách</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="data-table">
                            <!-- Dữ liệu được nạp tự động -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- POPUP FORM THÊM / SỬA KHÁCH HÀNG -->
    <div class="modal-overlay" id="customerModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalTitle">Thêm khách hàng mới</h3>
                <button class="close-modal" onclick="dongModal()">&times;</button>
            </div>
            <input type="hidden" id="editingId">
            <div class="form-group-modal">
                <label>Họ và tên (*):</label>
                <input type="text" id="hovaten" placeholder="Nhập họ và tên...">
            </div>
            <div class="form-group-modal">
                <label>Số điện thoại:</label>
                <input type="text" id="sodienthoai" placeholder="Nhập số điện thoại...">
            </div>
            <div class="form-group-modal">
                <label>Địa chỉ:</label>
                <input type="text" id="diachi" placeholder="Nhập địa chỉ...">
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="dongModal()">Hủy</button>
                <button class="btn-primary" onclick="luuKhachHang()">Lưu dữ liệu</button>
            </div>
        </div>
    </div>

    <script>
        let danhSachKhachHangGoc = [];
        let mapThuCung = {};
        let mapLichSuKham = {};

        async function fetchKhachHang() {
            // 1. Tải danh sách thú cưng để thống kê theo khách hàng
            const { data: tcData } = await db.from('thucung').select('*');
            if (tcData) {
                tcData.forEach(tc => {
                    let maKH = tc.makhachhang || tc.makh || tc.khachhang_id;
                    if (!mapThuCung[maKH]) mapThuCung[maKH] = [];
                    mapThuCung[maKH].push(tc);
                });
            }

            // 2. Tải danh sách khám bệnh để tính tổng chi tiêu và lần khám gần nhất
            const { data: kbData } = await db.from('khambenh').select('*');
            if (kbData && tcData) {
                // Tạo bảng map từ mathucung -> makhachhang
                let petToKhach = {};
                tcData.forEach(tc => {
                    petToKhach[tc.id] = tc.makhachhang || tc.makh || tc.khachhang_id;
                });

                kbData.forEach(kb => {
                    let maKH = petToKhach[kb.mathucung];
                    if (maKH) {
                        if (!mapLichSuKham[maKH]) {
                            mapLichSuKham[maKH] = { tongTien: 0, lanKhamGanNhat: null, soLan: 0 };
                        }
                        mapLichSuKham[maKH].tongTien += parseFloat(kb.tongchiphi || kb.thanhtien || 0);
                        mapLichSuKham[maKH].soLan += 1;

                        let ngayKham = kb.ngaykham || kb.created_at;
                        if (ngayKham) {
                            if (!mapLichSuKham[maKH].lanKhamGanNhat || new Date(ngayKham) > new Date(mapLichSuKham[maKH].lanKhamGanNhat)) {
                                mapLichSuKham[maKH].lanKhamGanNhat = ngayKham;
                            }
                        }
                    }
                });
            }

            // 3. Tải danh sách khách hàng chính
            const { data, error } = await db.from('khachhang').select('*').order('id', { ascending: true });
            if (error) {
                console.error('Lỗi tải dữ liệu:', error);
            } else {
                danhSachKhachHangGoc = data;
                hienThiBang(danhSachKhachHangGoc);
            }
        }

        function hienThiBang(data) {
            const tableBody = document.getElementById('data-table');
            tableBody.innerHTML = '';
            
            if(data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:#777;">Không tìm thấy khách hàng phù hợp</td></tr>`;
                return;
            }

            data.forEach(item => {
                const maKhachHang = formatMaKhachHang(item.id);
                const soDienThoaiHtml = item.sodienthoai 
                    ? `<a href="tel:${item.sodienthoai}" style="color: #2563eb; text-decoration: none; font-weight: bold;" title="Bấm để gọi">${item.sodienthoai} 📞</a>` 
                    : '---';

                // Lấy thông tin thú cưng của khách
                const dsPet = mapThuCung[item.id] || [];
                const soLuongPet = dsPet.length;
                const tenPetText = soLuongPet > 0 ? dsPet.map(p => p.tenthucung).join(', ') : 'Chưa có thú cưng';

                // Lấy thông tin lịch sử khám & chi tiêu
                const lichSu = mapLichSuKham[item.id] || { tongTien: 0, lanKhamGanNhat: null, soLan: 0 };
                const tongChiTieuText = Number(lichSu.tongTien).toLocaleString('vi-VN') + ' đ';
                const lanKhamText = lichSu.lanKhamGanNhat ? new Date(lichSu.lanKhamGanNhat).toLocaleDateString('vi-VN') : '---';

                // Phân loại khách hàng tự động
                let loaiKhachHtml = `<span style="padding: 3px 8px; border-radius: 4px; font-size: 12px; background: #e0f2fe; color: #0369a1; font-weight: 500;">Mới</span>`;
                if (lichSu.soLan > 0) {
                    if (lichSu.tongTien >= 5000000) {
                        loaiKhachHtml = `<span style="padding: 3px 8px; border-radius: 4px; font-size: 12px; background: #fef3c7; color: #d97706; font-weight: bold;">VIP 👑</span>`;
                    } else {
                        loaiKhachHtml = `<span style="padding: 3px 8px; border-radius: 4px; font-size: 12px; background: #dcfce7; color: #15803d; font-weight: 500;">Thường</span>`;
                    }
                }

                tableBody.innerHTML += `<tr>
                    <td><strong>${maKhachHang}</strong></td>
                    <td>
                        <b>${item.hovaten || ''}</b><br>
                        <span style="font-size: 12px;">${soDienThoaiHtml}</span>
                    </td>
                    <td>${item.diachi || '---'}</td>
                    <td><span style="color: #0284c7; font-weight: 600;">${soLuongPet} thú cưng</span><br><span style="font-size: 11px; color: #555;">(${tenPetText})</span></td>
                    <td style="font-size: 12px;">${lanKhamText}</td>
                    <td><b>${tongChiTieuText}</b></td>
                    <td>${loaiKhachHtml}</td>
                    <td style="white-space: nowrap;">
                        <button class="btn-add-pet" onclick="themThuCungChoKhach(${item.id})" title="Thêm thú cưng">+ Thú cưng</button>
                        <button class="btn-edit" onclick="moModalSua(${item.id}, '${item.hovaten || ''}', '${item.sodienthoai || ''}', '${item.diachi || ''}')">Sửa</button>
                        <button class="btn-delete" onclick="xoaKhachHang(${item.id})">Xóa</button>
                    </td>
                </tr>`;
            });
        }

        function themThuCungChoKhach(makhachhang) {
            window.location.href = `thucung.html?makhachhang=${makhachhang}`;
        }

        function timKiemKhachHang() {
            const tuKhoa = document.getElementById('searchInput').value.toLowerCase().trim();
            const ketQuaLoc = danhSachKhachHangGoc.filter(item => {
                const ten = (item.hovaten || '').toLowerCase();
                const sdt = (item.sodienthoai || '').toLowerCase();
                const ma = formatMaKhachHang(item.id).toLowerCase();
                return ten.includes(tuKhoa) || sdt.includes(tuKhoa) || ma.includes(tuKhoa);
            });
            hienThiBang(ketQuaLoc);
        }

        function moModalThem() {
            document.getElementById('editingId').value = '';
            document.getElementById('hovaten').value = '';
            document.getElementById('sodienthoai').value = '';
            document.getElementById('diachi').value = '';
            document.getElementById('modalTitle').innerText = 'Thêm khách hàng mới';
            document.getElementById('customerModal').style.display = 'flex';
        }

        function moModalSua(id, hovaten, sodienthoai, diachi) {
            document.getElementById('editingId').value = id;
            document.getElementById('hovaten').value = hovaten;
            document.getElementById('sodienthoai').value = sodienthoai;
            document.getElementById('diachi').value = diachi;
            document.getElementById('modalTitle').innerText = 'Cập nhật thông tin khách hàng (ID: ' + id + ')';
            document.getElementById('customerModal').style.display = 'flex';
        }

        function dongModal() {
            document.getElementById('customerModal').style.display = 'none';
        }

        async function luuKhachHang() {
            const id = document.getElementById('editingId').value;
            const hovaten = document.getElementById('hovaten').value.trim();
            const sodienthoai = document.getElementById('sodienthoai').value.trim();
            const diachi = document.getElementById('diachi').value.trim();

            if (!hovaten) {
                alert('Vui lòng nhập tên khách hàng!');
                return;
            }

            if (id === "") {
                const { error } = await db.from('khachhang').insert([{ hovaten, sodienthoai, diachi }]);
                if (error) {
                    alert('Lỗi thêm dữ liệu: ' + error.message);
                } else {
                    alert('Thêm khách hàng thành công!');
                    dongModal();
                    fetchKhachHang();
                }
            } else {
                const { error } = await db.from('khachhang').update({ hovaten, sodienthoai, diachi }).eq('id', id);
                if (error) {
                    alert('Lỗi cập nhật dữ liệu: ' + error.message);
                } else {
                    alert('Cập nhật thành công!');
                    dongModal();
                    fetchKhachHang();
                }
            }
        }

        async function xoaKhachHang(id) {
            if (confirm('Bạn có chắc chắn muốn xóa khách hàng ID: ' + id + ' này không?')) {
                const { error } = await db.from('khachhang').delete().eq('id', id);
                if (error) {
                    alert('Lỗi khi xóa: ' + error.message);
                } else {
                    alert('Xóa thành công!');
                    fetchKhachHang();
                }
            }
        }

        fetchKhachHang();
    </script>
</body>
</html>
